<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>خزانتي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خزانتي">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #1b1916; --muted: #77716a; --line: #e6e0d7;
    --accent: #7a4e2d; --accent-2: #f1e6da; --ok: #2f8a5b; --bad: #c6423a; --chip: #ece7df;
    --shadow: 0 1px 2px rgba(40,30,20,.05), 0 8px 24px rgba(40,30,20,.06);
    --bar: rgba(255,255,255,.88); --stage: radial-gradient(120% 90% at 50% 20%, #ffffff 0%, #ece6dd 100%);
    --check: #efebe5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210; --card: #1e1c19; --text: #f3efe9; --muted: #a39b91; --line: #2e2b27;
      --accent: #d9a46c; --accent-2: #3a2c1f; --ok: #5cc28c; --bad: #ff7a70; --chip: #2a2723;
      --shadow: none; --bar: rgba(26,24,21,.9); --stage: radial-gradient(120% 90% at 50% 20%, #2c2925 0%, #171513 100%);
      --check: #262320;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px);
    max-width: 560px; margin: 0 auto; -webkit-user-select: none; user-select: none;
  }
  input, select, button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .muted { color: var(--muted); }

  header.top { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
  header.top h1 { font-size: 28px; margin: 0; letter-spacing: -.3px; }
  header.top .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .icon-btn { background: var(--card); border: 0; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow); font-size: 18px; }

  .card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 17px; }
  .link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 15px; padding: 4px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 4px; }
  .chip { border: 0; background: var(--chip); padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; font-weight: 600; }
  .chip.on { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip.on { color: #1b1308; } }

  .btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 16px; background: var(--chip); }
  .btn.primary { background: var(--accent); color: #fff; width: 100%; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #1b1308; } }
  .btn.danger { background: transparent; color: var(--bad); width: 100%; }
  .btn.ghost { background: var(--accent-2); color: var(--accent); }

  /* weather */
  .weather { display: flex; align-items: center; gap: 14px; }
  .weather .wicon { font-size: 40px; line-height: 1; }
  .weather .wtemp { font-size: 34px; font-weight: 800; }
  .weather .wmeta { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .weather .wmeta b { color: var(--text); font-weight: 700; }

  /* 3D stage */
  .viewer-wrap { position: relative; height: 420px; border-radius: 18px; background: var(--stage); overflow: hidden; touch-action: none; }
  .viewer-wrap.small { height: 320px; }
  .viewer-wrap canvas { width: 100% !important; height: 100% !important; display: block; }
  .viewer-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; pointer-events: none; }
  .viewer-tools { position: absolute; bottom: 10px; inset-inline: 10px; display: flex; gap: 6px; justify-content: center; pointer-events: none; }
  .viewer-tools button { pointer-events: auto; border: 0; background: var(--bar); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); }
  .viewer-tools button.on { color: var(--accent); }
  .viewer-hint { position: absolute; top: 10px; inset-inline: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }

  .why { font-size: 14px; color: var(--muted); margin: 12px 2px 4px; line-height: 1.6; }
  .pieces { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px; scrollbar-width: none; }
  .pieces::-webkit-scrollbar { display: none; }
  .piece { flex: none; width: 74px; border: 2px solid transparent; background: var(--chip); border-radius: 14px; padding: 6px 4px 4px; position: relative; }
  .piece img { width: 100%; height: 56px; object-fit: contain; display: block; }
  .piece small { display: block; font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece.locked { border-color: var(--accent); }
  .piece .lock { position: absolute; top: 3px; inset-inline-start: 4px; font-size: 13px; }
  .actions { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
  .actions .btn { padding: 12px 6px; font-size: 15px; }

  /* closet grid */
  .search { width: 100%; border: 0; background: var(--card); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; outline: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--card); border: 0; border-radius: 16px; padding: 8px 6px 7px; box-shadow: var(--shadow); text-align: center; position: relative; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  .tile .t-name { font-size: 12px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .t-sub { font-size: 11px; color: var(--muted); }
  .tile .fav { position: absolute; top: 6px; inset-inline-end: 8px; font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .count { color: var(--muted); font-size: 13px; margin: 0 4px 8px; }

  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .snap { background: var(--card); border: 0; border-radius: 18px; padding: 6px; box-shadow: var(--shadow); }
  .snap img { width: 100%; border-radius: 13px; display: block; aspect-ratio: 3/4; object-fit: cover; background: var(--stage); }
  .snap div { font-size: 12px; color: var(--muted); padding: 6px 4px 2px; }

  .empty { text-align: center; padding: 34px 18px; }
  .empty .big { font-size: 54px; }
  .empty h2 { margin: 8px 0 6px; font-size: 20px; }
  .empty p { color: var(--muted); margin: 0 0 18px; line-height: 1.7; font-size: 15px; }

  /* stats + calendar */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--chip); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: 0; }
  .list-row img { width: 42px; height: 42px; object-fit: contain; background: var(--chip); border-radius: 10px; }
  .list-row .grow { flex: 1; min-width: 0; font-size: 14px; }
  .mini-thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-thumbs button { border: 0; padding: 4px; background: var(--chip); border-radius: 12px; }
  .mini-thumbs img { width: 52px; height: 52px; object-fit: contain; display: block; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dn { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .day { border: 0; aspect-ratio: 3/4; border-radius: 10px; background: var(--chip) center/cover no-repeat; position: relative; font-size: 12px; padding: 0; }
  .day span { position: absolute; top: 3px; inset-inline-start: 5px; font-weight: 600; }
  .day.has span { background: var(--bar); border-radius: 6px; padding: 0 4px; }
  .day.today { outline: 2px solid var(--accent); }
  .day.blank { background: none; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .setting:first-of-type { border-top: 0; }
  .setting .val { color: var(--muted); font-size: 14px; }

  /* tab bar */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-around; align-items: flex-end;
    padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--bar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  nav.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); width: 64px; font-weight: 600; }
  nav.tabbar button .ti { font-size: 21px; line-height: 1.1; filter: grayscale(1); opacity: .7; }
  nav.tabbar button.on { color: var(--accent); }
  nav.tabbar button.on .ti { filter: none; opacity: 1; }
  nav.tabbar .add { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 30px; margin-top: -24px; box-shadow: 0 6px 18px rgba(122,78,45,.35); justify-content: center; }
  @media (prefers-color-scheme: dark) { nav.tabbar .add { color: #1b1308; } }

  /* sheet */
  .sheet-bg, .menu-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
  .sheet {
    position: fixed; inset: 0; z-index: 31; background: var(--bg); display: flex; flex-direction: column;
    animation: up .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom: 1px solid var(--line); background: var(--bar); gap: 8px; }
  .sheet-head h2 { margin: 0; font-size: 17px; flex: 1; text-align: center; }
  .sheet-head button { border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 600; min-width: 60px; padding: 6px; }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px calc(env(safe-area-inset-bottom) + 30px); max-width: 560px; width: 100%; margin: 0 auto; }
  .menu-bg { z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .menu { width: 100%; max-width: 560px; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 12px calc(env(safe-area-inset-bottom) + 12px); animation: up .22s ease; max-height: 80vh; overflow-y: auto; }
  .menu h4 { margin: 6px 4px 10px; font-size: 14px; color: var(--muted); text-align: center; font-weight: 600; }
  .menu .opt { display: block; width: 100%; border: 0; background: var(--chip); border-radius: 14px; padding: 14px; margin-bottom: 8px; font-size: 16px; font-weight: 600; text-align: center; }
  .menu .opt.danger { color: var(--bad); }
  .menu .opt.cancel { background: none; color: var(--muted); }

  /* editor */
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .ph { border: 0; background: var(--card); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); text-align: center; }
  .ph.active { outline: 2px solid var(--accent); }
  .ph .box { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
    background-color: var(--check);
    background-image: conic-gradient(var(--chip) 25%, transparent 0 50%, var(--chip) 0 75%, transparent 0);
    background-size: 18px 18px; }
  .ph .box img { max-width: 100%; max-height: 100%; }
  .ph .box .plus { font-size: 30px; color: var(--muted); }
  .ph .lbl { font-size: 13px; font-weight: 600; margin-top: 6px; }
  /* how-to-shoot guide + live camera with the garment outline */
  .guide { display: flex; gap: 12px; align-items: center; background: var(--chip); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; text-align: start; }
  .guide svg { width: 92px; height: 120px; flex: none; }
  .guide ol { margin: 0; padding-inline-start: 18px; font-size: 13px; line-height: 1.7; }
  .guide.steps { display: block; }
  .guide b { color: var(--accent); }
  .cam { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam .outline { position: absolute; inset: 14% 12% 18%; display: grid; place-items: center; pointer-events: none; }
  .cam .outline svg { width: 100%; height: 100%; }
  .cam .tip { position: absolute; top: calc(env(safe-area-inset-top) + 12px); inset-inline: 12px; color: #fff; background: rgba(0,0,0,.5); border-radius: 14px; padding: 10px 12px; font-size: 14px; text-align: center; line-height: 1.6; }
  .cam .bar { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px); inset-inline: 0; display: flex; align-items: center; justify-content: space-around; }
  .cam .bar button { border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 15px; font-weight: 600; padding: 10px 14px; border-radius: 999px; min-width: 80px; }
  .cam .shutter { width: 74px; height: 74px; min-width: 0 !important; border-radius: 50% !important; background: #fff !important; box-shadow: 0 0 0 5px rgba(255,255,255,.35); padding: 0 !important; }
  /* flat outfit view */
  .view-mode { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .flat { position: relative; height: 420px; border-radius: 18px; background: var(--stage); overflow: hidden; }
  .flat .sl { position: absolute; display: flex; align-items: center; justify-content: center; }
  .flat .sl img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
  .cut-panel { background: var(--card); border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .cut-panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
  .field { margin: 14px 0 6px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .field span { font-weight: 500; color: var(--muted); font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .text { width: 100%; border: 0; background: var(--card); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); outline: none; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { border: 0; display: flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 14px; font-weight: 600; }
  .sw i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .palette button { border: 0; background: var(--chip); border-radius: 12px; padding: 8px 4px; font-size: 12px; font-weight: 600; }
  .palette i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 99px; background: var(--line); position: relative; transition: .2s; flex: none; }
  .toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle:checked { background: var(--ok); }
  .toggle:checked::after { right: 23px; }
  .busy { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.25); }
  .busy div { background: var(--card); padding: 16px 22px; border-radius: 16px; font-weight: 600; box-shadow: var(--shadow); }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%); z-index: 60;
    background: #1b1916; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="title">خزانتي</h1>
    <div class="sub" id="todayDate"></div>
  </div>
</header>

<main>
  <!-- TODAY -->
  <section class="view" id="v-today">
    <div class="card" id="weatherCard"></div>
    <div class="chips" id="occChips"></div>
    <div id="todayEmpty" hidden></div>
    <div class="card" id="outfitCard" hidden>
      <div class="view-mode" id="viewMode"><button class="chip" data-mode="3d">🧍 مجسم</button><button class="chip" data-mode="flat">🖼️ مسطح</button></div>
      <div class="viewer-wrap" id="todayViewer"></div>
      <div class="flat" id="todayFlat" hidden></div>
      <div class="why" id="whyLine"></div>
      <div class="pieces" id="pieces"></div>
      <div class="hint" style="margin:0 2px">اضغط على قطعة لتثبيتها 🔒 ثم «طقم آخر» يغيّر الباقي.</div>
      <div class="actions">
        <button class="btn ghost" id="againBtn">🔄 طقم آخر</button>
        <button class="btn" id="dislikeBtn" aria-label="ما عجبني">👎</button>
        <button class="btn" id="likeBtn" aria-label="عجبني">👍</button>
        <button class="btn" id="saveOutfitBtn" aria-label="حفظ الطقم">🤍</button>
      </div>
      <button class="btn primary" id="woreBtn">✅ لبسته اليوم</button>
    </div>
  </section>

  <!-- CLOSET -->
  <section class="view" id="v-closet" hidden>
    <input class="search" id="search" placeholder="ابحث: قميص، كحلي، ثوب…" type="search">
    <div class="chips" id="catChips"></div>
    <div class="count" id="closetCount"></div>
    <div class="grid" id="closetGrid"></div>
  </section>

  <!-- OUTFITS -->
  <section class="view" id="v-outfits" hidden>
    <div class="grid2" id="outfitGrid"></div>
  </section>

  <!-- MORE -->
  <section class="view" id="v-more" hidden>
    <div class="card" id="statsCard"></div>
    <div class="card" id="calCard"></div>
    <div class="card" id="settingsCard"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="on"><span class="ti">☀️</span>اليوم</button>
  <button data-tab="closet"><span class="ti">👕</span>الخزانة</button>
  <button class="add" id="addBtn" aria-label="إضافة قطعة">+</button>
  <button data-tab="outfits"><span class="ti">🤍</span>الأطقم</button>
  <button data-tab="more"><span class="ti">📊</span>المزيد</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <button id="sheetClose">إغلاق</button>
    <h2 id="sheetTitle"></h2>
    <button id="sheetAct"></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="menu-bg" id="menuBg" hidden><div class="menu" id="menu"></div></div>
<div class="busy" id="busy" hidden><div id="busyText">لحظة…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script>
'use strict';
// ───────────────────────── helpers ─────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysSince = key => key ? Math.round((Date.parse(todayKey()) - Date.parse(key)) / 864e5) : 999;
const nextFrame = () => new Promise(r => setTimeout(r, 40)); // lets the busy overlay paint before heavy work

function toast(msg) {

    const items = [];
    for (const it of S.items) { const o = { ...it }; for (const k of IMG_KEYS) o[k] = it[k] ? await blobToDataURL(it[k]) : null; items.push(o); }
    const data = { app: 'khizanati', v: 1, exported: new Date().toISOString(), items, outfits: S.outfits, history: Object.values(S.history), prefs: S.prefs, weights: S.w };
    const name = `khizanati-${todayKey()}.json`;
    const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
    busy(false);
    if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'نسخة خزانتي' }); return; } catch { return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { busy(false); toast('فشل التصدير'); console.error(e); }
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'khizanati') return toast('هذا مو ملف خزانتي');
    if (!confirm(`الملف فيه ${data.items.length} قطعة. نستبدل بياناتك الحالية فيه؟`)) return;
    busy(true, 'نسترجع…');
    for (const s of ['items', 'outfits', 'history']) await DB.clear(s);
    for (const it of data.items) {
      for (const k of IMG_KEYS) it[k] = typeof it[k] === 'string' ? await dataURLToBlob(it[k]) : null;
      await DB.put('items', it);
    }
    for (const o of data.outfits || []) await DB.put('outfits', o);
    for (const h of data.history || []) await DB.put('history', h);
    if (data.prefs) await kvSet('prefs', data.prefs);
    if (data.weights) await kvSet('weights', data.weights);
    await kvSet('today', null);
    busy(false); location.reload();
  } catch (e) { busy(false); toast('الملف تالف'); console.error(e); }
}
$('importIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); });

// ───────────────────────── events ─────────────────────────
$('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'addBtn') return openEditor();
  switchTab(b.dataset.tab);
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-act=add]')) openEditor();
});
$('weatherCard').addEventListener('click', e => {
  const w = e.target.closest('[data-w]')?.dataset.w;
  if (w === 'locate') locate();
  if (w === 'manual') setManualTemp();
});
$('occChips').addEventListener('click', e => {
  const b = e.target.closest('[data-occ]'); if (!b || b.dataset.occ === S.occ) return;
  S.occ = b.dataset.occ; S.shown = []; newOutfit();
});
$('pieces').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const id = b.dataset.id;
  S.locked.has(id) ? S.locked.delete(id) : S.locked.add(id);
  renderToday();
});
$('againBtn').onclick = () => newOutfit();
$('likeBtn').onclick = () => { learn(S.today.ids, 1); toast('حلو! بنقترح مثله أكثر 👍'); };
$('dislikeBtn').onclick = () => { learn(S.today.ids, -1); toast('تمام، بنقلل من هالتنسيق'); newOutfit(); };
$('saveOutfitBtn').onclick = async () => {
  const key = S.today.ids.slice().sort().join();
  const ex = S.outfits.find(o => o.ids.slice().sort().join() === key);
  if (ex) { await DB.del('outfits', ex.id); S.outfits = S.outfits.filter(o => o !== ex); toast('انشال من المحفوظات'); }
  else {
    const o = { id: uid(), ids: [...S.today.ids], snap: await outfitSnapshot(), occ: S.occ, created: Date.now() };
    await DB.put('outfits', o); S.outfits.push(o); learn(o.ids, .5); toast('انحفظ في أطقمي ❤️');
  }
  renderToday(); renderOutfits();
};
$('woreBtn').onclick = async () => {
  const worn = S.history[todayKey()];
  if (worn && worn.ids.slice().sort().join() === S.today.ids.slice().sort().join()) return;
  await markWorn([...S.today.ids], await outfitSnapshot());
  S.today.worn = true; kvSet('today', S.today);
  toast('سجلناه ✅ لابس حلو اليوم'); renderToday(); renderCloset(); renderMore();
};
$('search').addEventListener('input', e => { S.q = e.target.value; renderCloset(); });
$('catChips').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { S.cat = b.dataset.cat; renderCloset(); } });
$('closetGrid').addEventListener('click', e => { const b = e.target.closest('[data-item]'); if (b) openEditor(byId(b.dataset.item)); });
$('outfitGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-outfit]'); if (!b) return;
  const o = S.outfits.find(x => x.id === b.dataset.outfit);
  showOutfitSheet('طقم محفوظ', o.ids, o.snap, [
    { label: '👀 اعرضه على المجسم', fn: () => loadIntoToday(o.ids) },
    { label: '✅ لبسته اليوم', fn: async () => { await markWorn(o.ids.filter(byId), o.snap); toast('سجلناه ✅'); loadIntoToday(o.ids); renderMore(); } },
    { label: 'حذف الطقم', danger: true, fn: async () => { await DB.del('outfits', o.id); S.outfits = S.outfits.filter(x => x !== o); renderOutfits(); } },
  ]);
});
$('v-more').addEventListener('click', e => {
  const c = e.target.closest('[data-cal]');
  if (c) { calMonth.setMonth(calMonth.getMonth() + +c.dataset.cal); renderMore(); return; }
  const d = e.target.closest('[data-day]');
  if (d) {
    const h = S.history[d.dataset.day]; if (!h) return;
    showOutfitSheet(new Date(d.dataset.day + 'T12:00').toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }), h.ids, h.snap, [
      { label: '👀 اعرضه على المجسم', fn: () => loadIntoToday(h.ids) },
      { label: 'حذف من السجل', danger: true, fn: async () => {
        for (const id of h.ids) { const it = byId(id); if (it) { it.wearCount = Math.max(0, (it.wearCount || 1) - 1); await DB.put('items', it); } }
        await DB.del('history', h.date); delete S.history[h.date]; renderMore(); renderCloset(); renderToday();
      } },
    ]);
    return;
  }
  const r = e.target.closest('[data-revive]');
  if (r) { S.locked = new Set([r.dataset.revive]); switchTab('today'); newOutfit(); return; }
  const s = e.target.closest('[data-set]')?.dataset.set;
  if (s === 'locate') locate();
  if (s === 'city') citySearch();
  if (s === 'temp') setManualTemp();
  if (s === 'ai') setAiKey();
  if (s === 'export') exportData();
  if (s === 'import') $('importIn').click();
  if (s === 'resetTaste' && confirm('نصفّر اللي تعلمناه من 👍👎؟')) { S.w = { p: {}, i: {} }; kvSet('weights', S.w); toast('تم التصفير'); }
  if (s === 'wipe' && confirm('تحذف كل الملابس والأطقم والسجل؟ ما ينفع التراجع.') && confirm('متأكد؟ صدّر نسخة احتياطية قبل إذا تبي.')) {
    Promise.all(['items', 'outfits', 'history', 'kv'].map(DB.clear)).then(() => location.reload());
  }
});

// ───────────────────────── icon ─────────────────────────
function drawIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#9a6a42'); g.addColorStop(1, '#5e3a1f');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  x.strokeStyle = '#fff'; x.lineWidth = 9; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.arc(90, 52, 14, Math.PI, Math.PI * 2.35); x.lineTo(90, 78);
  x.lineTo(30, 120); x.quadraticCurveTo(22, 130, 36, 130); x.lineTo(144, 130); x.quadraticCurveTo(158, 130, 150, 120); x.lineTo(90, 78); x.stroke();
  const url = c.toDataURL('image/png');
  $('touchIcon').href = url; $('favIcon').href = url;
}

// ───────────────────────── boot ─────────────────────────
async function boot() {
  drawIcon();
  $('todayDate').textContent = new Date().toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' });
  await DB.open();
  const [items, outfits, hist] = await Promise.all([DB.all('items'), DB.all('outfits'), DB.all('history')]);
  S.items = items; S.outfits = outfits; S.history = Object.fromEntries(hist.map(h => [h.date, h]));
  S.prefs = { ...S.prefs, ...(await kvGet('prefs') || {}) };
  S.w = await kvGet('weights') || S.w;
  S.aiKey = await kvGet('aiKey') || '';
  S.weather = await kvGet('weather') || null;
  const t = await kvGet('today');
  if (t && t.date === todayKey() && t.ids.every(byId)) { S.today = t; S.occ = t.occ; }
  renderAll();
  if (!S.today && S.items.length) newOutfit();
  refreshWeather(); namePlace();
  navigator.storage?.persist?.();
  if (S.items.length) Viewer.init().catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (S.today && S.today.date !== todayKey()) { S.locked.clear(); S.shown = []; newOutfit(); $('todayDate').textContent = new Date().toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }); }
  refreshWeather();
});
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('afterbegin', '<div class="card">صار خطأ في فتح البيانات. جرّب تحدّث الصفحة.</div>'); });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // when an update installs, reload once so the new version shows right away instead of on the next open
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !ed) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
// test hook for local development
window.__app = { S, generate, removeBackground, extractColors, Viewer, openEditor, usePhoto: (s, b) => usePhoto(s, b), newOutfit, DB };
</script>
